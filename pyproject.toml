[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project]
name = "query-processing-agent"
version = "0.1.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "datafusion>=43",
    "fastexcel>=0.12",
    "huggingface-hub>=0.30",
    "joblib>=1.6.0",
    "mistralrs>=0.4",
    "numpy>=1.26",
    "orjson>=3.10",
    "polars>=1.0",
    "scikit-learn>=1.5",
]

[tool.uv.build-backend]
module-name = "datamate"
