name: Build Docker Submission

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'predict.sh'
      - 'requirements.txt'
      - 'src/**'
      - 'training_code/**'
      - '.github/workflows/build-docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Initial disk space:"
          df -h
          echo "Aggressively removing heavy unused tools..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Model Downloader Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub

      - name: Download Model Weights and Tokenizer
        run: |
          echo "Downloading Qwen3.5-9B GGUF model and tokenizer..."
          python scripts/download_model.py
          echo "Disk space after model download:"
          df -h

      - name: Build Docker Image
        run: |
          echo "Building Docker image zaic2026_datamate_zalotrunua:final..."
          docker build -t zaic2026_datamate_zalotrunua:final .
          echo "Docker build finished. Cleaning host model copy and build cache..."
          rm -rf models/
          rm -rf train/ public_test/
          sudo docker builder prune --all --force || true
          echo "Free disk space available for saving archive:"
          df -h

      - name: Export and Compress Docker Image
        run: |
          echo "Saving and compressing Docker image (gzip -1)..."
          docker save zaic2026_datamate_zalotrunua:final | gzip -1 > zaic2026_datamate_zalotrunua.tar.gz
          echo "Compressed archive size:"
          ls -lh zaic2026_datamate_zalotrunua.tar.gz
          echo "Freeing Docker images to maximize space..."
          sudo docker rmi zaic2026_datamate_zalotrunua:final vllm/vllm-openai:v0.33.0 || true
          sudo docker system prune --all --force --volumes || true
          df -h

      - name: Generate MD5 Checksum
        id: checksum
        run: |
          echo "Calculating MD5 checksum..."
          md5sum zaic2026_datamate_zalotrunua.tar.gz > zaic2026_datamate_zalotrunua.tar.gz.md5
          MD5_VAL=$(cat zaic2026_datamate_zalotrunua.tar.gz.md5 | awk '{print $1}')
          echo "MD5_CHECKSUM=$MD5_VAL" >> $GITHUB_ENV
          echo "=========================================================="
          echo "OFFICIAL MD5 CHECKSUM: $MD5_VAL"
          echo "=========================================================="
          md5sum -c zaic2026_datamate_zalotrunua.tar.gz.md5

      - name: Upload to Direct Cloud Storage (GoFile)
        run: |
          echo "Fetching best GoFile server..."
          SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
          echo "Uploading zaic2026_datamate_zalotrunua.tar.gz to ${SERVER}.gofile.io..."
          RESP=$(curl -F "file=@zaic2026_datamate_zalotrunua.tar.gz" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Response: $RESP"
          DOWNLOAD_URL=$(echo "$RESP" | python3 -c "import sys, json; print(json.loads(sys.stdin.read()).get('data', {}).get('downloadPage', 'Failed to parse'))")
          echo "=========================================================="
          echo "DIRECT DOWNLOAD LINK: $DOWNLOAD_URL"
          echo "=========================================================="
          
          # Write summary to GitHub Step Summary
          echo "## 🎉 DataMate Docker Submission Package Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 1. Chuỗi mã MD5 nộp BTC:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.MD5_CHECKSUM }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 2. Link tải trực tiếp file nén (.tar.gz):" >> $GITHUB_STEP_SUMMARY
          echo "**👉 [BẤM VÀO ĐÂY ĐỂ TẢI FILE NÉN]($DOWNLOAD_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sau khi tải về, bạn chỉ việc upload file lên Google Drive của bạn và nộp link cho BTC." >> $GITHUB_STEP_SUMMARY
